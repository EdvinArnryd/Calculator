<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttonContainer">
            <div class="row">
                <button class="calcBtn numBtn">7</button>
                <button class="calcBtn numBtn">8</button>
                <button class="calcBtn numBtn">9</button>
                <button class="calcBtn operator">/</button>
            </div>
            <div class="row">
                <button class="calcBtn numBtn">4</button>
                <button class="calcBtn numBtn">5</button>
                <button class="calcBtn numBtn">6</button>
                <button class="calcBtn operator">*</button>
            </div>
            <div class="row">
                <button class="calcBtn numBtn">1</button>
                <button class="calcBtn numBtn">2</button>
                <button class="calcBtn numBtn">3</button>
                <button class="calcBtn operator">-</button>
            </div>
            <div class="row">
                <button class="calcBtn numBtn">0</button>
                <button class="calcBtn clearBtn">C</button>
                <button class="calcBtn equalsBtn">=</button>
                <button class="calcBtn operator">+</button>
            </div>
        </div>
    </div>
</body>
</html>
